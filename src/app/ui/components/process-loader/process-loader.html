<article class="c-receipt" role="status">
  <header class="c-receipt__head">
    <ibid-flip-text class="c-receipt__percent" [text]="percentLabel()" />
    <ibid-folded-text class="c-receipt__detail" [text]="detail()" />
  </header>

  @for (stage of stages(); track stage.id) {
    <section class="c-receipt__stage" [class.c-receipt__stage--done]="stage.isDone">
      <div class="c-receipt__panel">
        <span class="c-receipt__mark" aria-hidden="true">{{ stage.isDone ? '✓' : '' }}</span>
        <div class="c-receipt__body">
          <p class="c-receipt__title">{{ i18n.translate(stage.titleKey, stage.titleKey) }}</p>
          @if (stage.message) {
            <ibid-folded-text class="c-receipt__message" [text]="stage.message" />
          }
        </div>
      </div>
    </section>
  }
</article>
