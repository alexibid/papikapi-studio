<div class="c-viewer-3d" #container>
  <div class="c-viewer-3d__top-controls">
    <button class="c-viewer-3d__tool-btn" type="button" (click)="zoom(0.2)" [attr.aria-label]="i18n.translate('zoomIn')">+</button>
    <button class="c-viewer-3d__tool-btn" type="button" (click)="zoom(-0.2)" [attr.aria-label]="i18n.translate('zoomOut')">−</button>
    <button class="c-viewer-3d__tool-btn" type="button" (click)="resetView()" [attr.aria-label]="i18n.translate('resetView')">↺</button>
  </div>

  <canvas
    #webglCanvas
    class="c-viewer-3d__canvas"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="onPointerUp()"
    (wheel)="onWheel($event)"
  ></canvas>

  <div class="c-viewer-3d__step-card">
    <div class="c-viewer-3d__step-header">
      <span class="c-viewer-3d__step-badge">📄 {{ i18n.translate('flatSheet') }}</span>
      <span class="c-viewer-3d__step-index">
        {{ meshCount() }} {{ i18n.translate('meshes') }} · {{ triangleCount() }}
        {{ i18n.translate('triangles') }}
      </span>
    </div>
  </div>

  @if (problem()) {
    <p class="c-viewer-3d__step-desc">⚠️ {{ problem() }}</p>
  }
</div>
