<div class="c-viewer-3d" #container>
  <div class="c-viewer-3d__tools">
    <button class="c-viewer-3d__tool" type="button" (click)="zoom(1.2)"
            [attr.aria-label]="i18n.translate('zoomIn')">+</button>
    <button class="c-viewer-3d__tool" type="button" (click)="zoom(0.8)"
            [attr.aria-label]="i18n.translate('zoomOut')">−</button>
    <button class="c-viewer-3d__tool" type="button" (click)="resetView()"
            [attr.aria-label]="i18n.translate('resetView')">↺</button>
  </div>

  <canvas
    #webglCanvas
    class="c-viewer-3d__canvas"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="onPointerUp()"
    (wheel)="onWheel($event)"
  ></canvas>

  <div class="c-viewer-3d__readout">
    <span class="c-viewer-3d__badge">🧊 {{ i18n.translate('assembledModel') }}</span>
    <span class="c-viewer-3d__counts">
      {{ partCount() }} {{ i18n.translate('parts') }} · {{ triangleCount() }}
      {{ i18n.translate('triangles') }}
    </span>
  </div>

  @if (problem()) {
    <p class="c-viewer-3d__problem">⚠️ {{ problem() }}</p>
  }
</div>
